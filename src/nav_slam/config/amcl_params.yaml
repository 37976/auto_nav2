# AMCL (自适应蒙特卡洛定位) 参数配置
# 用于 map->odom 全局定位修正
amcl:
  ros__parameters:
    use_sim_time: True

    # ---- 坐标系 ----
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/scan"

    # ---- 粒子滤波器 ----
    # 全局定位需要更多粒子覆盖地图自由空间
    min_particles: 1000
    max_particles: 15000
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_fast: 0.001
    recovery_alpha_slow: 0.001
    resample_interval: 1
    save_pose_rate: 0.5

    # ---- 更新条件 ----
    # 平移>=update_min_d 或 旋转>=update_min_a 时触发一次滤波更新
    update_min_a: 0.2
    update_min_d: 0.25

    # ---- 运动模型噪声 (alpha1-alpha4: odom噪声) ----
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # 旋转→旋转
    alpha2: 0.2   # 平移→旋转
    alpha3: 0.2   # 平移→平移
    alpha4: 0.2   # 旋转→平移
    alpha5: 0.2   # （已弃用）

    # ---- 激光模型 (likelihood_field 更适合2D LiDAR + 已知地图) ----
    laser_model_type: "likelihood_field"
    laser_max_range: 100.0    # 匹配 100m 真实激光雷达
    laser_min_range: -1.0    # -1 表示使用传感器自报的最小范围
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    # ---- 光束跳帧 (加速) ----
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    max_beams: 120

    # ---- TF 广播 ----
    tf_broadcast: false      # 由 amcl_init_bridge 锁定后发静态 TF
